<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafarMate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SafarMate</h1>
        <button id="logout-button" class="hidden" style="background:none; border:1px solid white; color:white; padding:5px 10px; border-radius:4px; cursor:pointer;">Logout</button>
    </header>

    <main>
        <div id="message-area"></div>

        <section id="login-view">
            <h2 style="text-align:center; margin-bottom:20px; color:var(--app-header-bg);">Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="username" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" required>
                </div>
                <button type="submit">Login</button>
            </form>
            <p style="margin-top:15px; text-align:center;">New user? <a href="#" id="show-signup-link">Create an account</a></p>
        </section>

        <section id="signup-view" class="hidden">
            <h2 style="text-align:center; margin-bottom:20px; color:var(--app-header-bg);">Sign Up</h2>
            <form id="signup-form">
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" required>
                </div>
                <button type="submit">Create Account</button>
            </form>
            <p style="margin-top:15px; text-align:center;">Already have an account? <a href="#" id="show-login-link">Login</a></p>
        </section>

        <section id="dashboard-view" class="hidden">
            <div class="chat-background-wrapper">
                <div id="posts-container">
                </div>
            </div>

            <footer id="input-area">
                <form id="create-post-form">
                    <input type="file" id="file-input" style="display: none;" accept="image/*,video/*">
                    
                    <label for="file-input" class="file-upload-label" title="Attach Image/Video" style="cursor: pointer; display: flex; align-items: center; justify-content: center;">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                        </svg>
                    </label>

                    <textarea id="post-content" rows="1" placeholder="Type a message..."></textarea>
                    
                    <button type="submit" title="Send">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2 .01 7z"></path>
                        </svg>
                    </button>
                </form>
            </footer>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
